<!DOCTYPE html>

</head>
<body>
    <div class="calculator">
        <div class="box">
            <input class="in1" type="text" value="">

            <input class="division" type="button" value="/">

        </div>
        <div class="result">
            
        </div>
    </div>
    <script src="main.js"></script>
